# L4 · 模糊语义（口语 → 字段映射）—— 12 条，断言 id_set / scalar
#
# 用户不会说"description LIKE '%电梯%'"，只会说"我不想爬楼梯"。
# 这一档考的是**口语诉求能不能落到真实存在的列上**，因此每条都必须在
# `house` 表里有确定的落脚点；没有字段支撑的语义（"通勤30分钟内""离公司近"）
# 一律不放——`house` 表没有坐标/地铁距离字段，那种用例只能靠人主观判分，
# 与"规则断言优先"相悖。
#
# 黄金 SQL 用的关键词都取自真实 description 文本，可由下面的 notes 逐一复核。

- id: L4-001
  tier: L4
  question: 深圳有没有安静一点的地方住，帮我推荐10套
  params: {city: 深圳, budget_max: 3000}
  room_count: 10
  assert: {mode: id_set}
  gold_sql: >
    SELECT id, price FROM house
    WHERE city = '深圳' AND description LIKE '%安静%'
    ORDER BY price ASC LIMIT 10
  notes: 口语"安静" → description 含"安静"；正好 4 套（id 2/24/39/46），全表复查过

