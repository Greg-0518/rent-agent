- id: L4-004
  tier: L4
  question: 深圳福田区我不想爬楼梯，帮我推荐10套
  params: {city: 深圳, district: 福田区, budget_max: 3000}
  room_count: 10
  assert: {mode: id_set}
  gold_sql: >
    SELECT id, price, floor FROM house
    WHERE city = '深圳' AND district = '福田区' AND description LIKE '%有电梯%'
    ORDER BY price ASC LIMIT 10
  notes: |
    口语"不想爬楼梯" → 要有电梯。7 套（福田区共 7 套，全部有电梯）。
    注意**不能**映射成 description LIKE '%爬楼梯%'（表里没有这个说法），
    也不能映射成低楼层——语义是"有电梯"，不是"楼低"。

