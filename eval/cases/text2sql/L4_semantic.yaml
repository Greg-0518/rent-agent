- id: L4-006
  tier: L4
  question: 深圳想找装修好一点的房子，帮我推荐10套
  params: {city: 深圳, budget_max: 3000}
  room_count: 10
  assert: {mode: id_set}
  gold_sql: >
    SELECT id, price FROM house
    WHERE city = '深圳'
      AND (description LIKE '%豪华%' OR description LIKE '%精装%')
    ORDER BY price ASC LIMIT 10
  notes: |
    「装修好一点」→ 装修档次条件。**黄金取 豪华 ∪ 精装 的并集**（8 套，id 3/8/11/20/29/31/40/45）。

    为什么不是只取「豪华装修」：这句话的语义阈值本来就落在两档之间，
    「豪华装修」和「精装修」都是站得住的读法，只判「豪华」等于在考
    *猜出题人偏好哪一档*，而不是考*有没有把"装修好"识别成一个装修档次条件*。
    实测模型返回的正是这 8 套（`%精装% OR %装修好% OR %豪华装修% OR %高档装修%`
    → 其中两个词在表里没有命中，等价于并集），且如实说明"共 8 套，不足 10 套"——
    这个答案比黄金更完整。原黄金只取 2 套，判 FAIL，是把口径差异记成了能力缺陷。

    放宽后这条仍然能测出东西：返回全部「装修」房源（含 id 1 简单装修、18 简易装修）
    依然缺 0 多 2 判 FAIL；忽略装修条件返回 10 套普通房源同样 FAIL。
    它测的是「有没有识别出装修档次」，不是「猜中哪一档」。

