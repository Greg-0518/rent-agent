  gold_sql: >
    SELECT id, price FROM house
    WHERE city = '深圳' AND description LIKE '%近地铁%' AND price <= 1500
    ORDER BY price ASC LIMIT 10
  notes: 2 套（id 1 = 550 / id 12 = 1350）。另外两套"近地铁"（id 30/35）超预算

- id: L4-012
  tier: L4
  question: 深圳有电梯的三居室，预算3000以内，帮我推荐10套
  params: {city: 深圳, budget_max: 3000}
  room_count: 10
  assert: {mode: id_set}
  gold_sql: >
    SELECT id, price FROM house
    WHERE city = '深圳' AND bedroom = 3
      AND description LIKE '%有电梯%' AND price <= 3000
    ORDER BY price ASC LIMIT 10
  notes: 9 套（三居室全部有电梯且全部 ≤3000，所以这条实际考的是"条件都写对没"）
