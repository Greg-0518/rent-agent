- id: L4-009
  tier: L4
  question: 深圳有海景并且租金不超过2500的房子，帮我推荐10套
  params: {city: 深圳, budget_max: 2500}
  room_count: 10
  assert: {mode: id_set}
  gold_sql: >
    SELECT id, price FROM house
    WHERE city = '深圳' AND description LIKE '%海景%' AND price <= 2500
    ORDER BY price ASC LIMIT 10
  notes: |
    2 套（id 6 "海景房" 980 / id 34 "海景房" 2300）。
    值钱的干扰项：id 20 描述含"近海岸城"（商场名，非海景），若写成 LIKE '%海%' 会误纳；
    id 37/46/49 是真海景但租金 2700+ 被预算挡住

- id: L4-010
  tier: L4
  question: 深圳哪个区租房最划算
  params: {city: 深圳, budget_max: 3000}
  assert: {mode: scalar}
  gold_sql: >
    SELECT district, ROUND(AVG(price), 2) AS avg_price FROM house
    WHERE city = '深圳'
    GROUP BY district ORDER BY AVG(price) ASC LIMIT 1
  notes: |
    口语"最划算" → 平均租金最低 → 光明区。
    与 L2-002 是同一答案、不同问法：L2 考聚合写法，这里考**口语到聚合的语义跳跃**，
    用来观察"答案对但路径错/路径对但答错"两类失败是否可分辨。

- id: L4-011
