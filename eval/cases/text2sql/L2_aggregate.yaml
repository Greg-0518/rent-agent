# L2 · 聚合统计（GROUP BY / HAVING / COUNT / AVG / MIN / MAX）—— 12 条
#
# 断言用 scalar / count，**期望值全部由 gold_sql 执行后产生**（eval/golden/text2sql.json），
# 不在 yaml 里手抄——手抄的期望值和黄金 SQL 两处对不上时无法复核。
#
# 黄金 SQL 的约定：**要断言的值必须放在结果集第一行的第一列**。
# 所以"哪个区最贵"写成 `SELECT district, AVG(price) ... LIMIT 1` 而不是先查聚合值。
#
# 刻意避开 AVG 做 scalar：平均值带小数，Agent 的 ROUND 位数不可控，
# 会造成"答案对但格式不同"的假失败。这里只让 MIN/MAX/COUNT/整值 AVG 承担 scalar。

- id: L2-001
  tier: L2
  question: 深圳哪个区的平均租金最贵
  params: {city: 深圳, budget_max: 3000}
  assert: {mode: scalar}
  gold_sql: >
    SELECT district, ROUND(AVG(price), 2) AS avg_price FROM house
    WHERE city = '深圳'
    GROUP BY district ORDER BY AVG(price) DESC LIMIT 1
  notes: 福田区 avg=2090 最高（盐田 2016 次之，差 74 元，区分度足够）

- id: L2-002
  tier: L2
  holdout: true
  question: 深圳哪个区的平均租金最便宜
  params: {city: 深圳, budget_max: 3000}
  assert: {mode: scalar}
  gold_sql: >
    SELECT district, ROUND(AVG(price), 2) AS avg_price FROM house
    WHERE city = '深圳'
    GROUP BY district ORDER BY AVG(price) ASC LIMIT 1
  notes: 光明区 avg=1456 最低；宝安 1483.33 紧随，考"是否真的按聚合值排序"

- id: L2-003
  tier: L2
  question: 深圳福田区的平均租金是多少
  params: {city: 深圳, district: 福田区, budget_max: 3000}
  assert: {mode: scalar}
  gold_sql: >
    SELECT ROUND(AVG(price), 2) FROM house
    WHERE city = '深圳' AND district = '福田区'
  notes: 14630/7 = 2090.00 整值，不受 ROUND 位数影响

- id: L2-004
  tier: L2
  question: 深圳最贵的那套房子月租多少钱
  params: {city: 深圳, budget_max: 3000}
  assert: {mode: scalar}
  gold_sql: >
    SELECT price FROM house WHERE city = '深圳' ORDER BY price DESC LIMIT 1
  notes: 3000（id 50）；与 L2-005 配对考 ORDER BY 方向

- id: L2-005
  tier: L2
  question: 深圳最便宜的那套房子月租多少钱
  params: {city: 深圳, budget_max: 3000}
  assert: {mode: scalar}
  gold_sql: >
    SELECT price FROM house WHERE city = '深圳' ORDER BY price ASC LIMIT 1
  notes: 550（id 1）

- id: L2-006
  tier: L2
  question: 深圳的两居室最低月租是多少
  params: {city: 深圳, budget_max: 3000}
  assert: {mode: scalar}
  gold_sql: >
    SELECT MIN(price) FROM house WHERE city = '深圳' AND bedroom = 2
  notes: 900（id 5）；MIN 聚合，值精确

- id: L2-007
  tier: L2
  question: 深圳宝安区最贵的房子月租多少钱
  params: {city: 深圳, district: 宝安区, budget_max: 3000}
  assert: {mode: scalar}
  gold_sql: >
