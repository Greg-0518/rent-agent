  notes: 2450（id 43）；区级 MAX

# ---- count 档：聚合写法（返回 1 行且值为 N）与明细写法（返回 N 行）都算对 ----

- id: L2-008
  tier: L2
  question: 深圳现在一共有多少套一居室
  params: {city: 深圳, budget_max: 3000}
  assert: {mode: count, count: 18}
  gold_sql: >
    SELECT COUNT(*) FROM house WHERE city = '深圳' AND bedroom = 1
  notes: 18 套；bedroom=1 而非 room_type 文本

- id: L2-009
  tier: L2
  question: 深圳福田区一共有多少套房源
  params: {city: 深圳, district: 福田区, budget_max: 3000}
  assert: {mode: count, count: 7}
  gold_sql: >
    SELECT COUNT(*) FROM house WHERE city = '深圳' AND district = '福田区'
  notes: 7 套

- id: L2-010
  tier: L2
  holdout: true
  question: 深圳有多少套房源是带电梯的
  params: {city: 深圳, budget_max: 3000}
  assert: {mode: count, count: 35}
  gold_sql: >
    SELECT COUNT(*) FROM house WHERE city = '深圳' AND description LIKE '%有电梯%'
  notes: |
    35 套。**这是本档最容易错的一条**：另有 15 套描述是"无电梯"，
    若写成 LIKE '%电梯%' 会得到 50——考的是"有电梯"这个正向语义，
    不是"提到电梯"。因此黄金条件必须是 '%有电梯%'。

- id: L2-011
  tier: L2
  question: 深圳有多少套三居室
  params: {city: 深圳, budget_max: 3000}
  assert: {mode: count, count: 9}
  gold_sql: >
    SELECT COUNT(*) FROM house WHERE city = '深圳' AND bedroom = 3
  notes: 9 套

- id: L2-012
  tier: L2
  question: 深圳朝东的房源有多少套
  params: {city: 深圳, budget_max: 3000}
  assert: {mode: count, count: 12}
  gold_sql: >
    SELECT COUNT(*) FROM house WHERE city = '深圳' AND orientation = '朝东'
  notes: 12 套；朝东/朝南(22)/朝北(9)/朝西(7)
