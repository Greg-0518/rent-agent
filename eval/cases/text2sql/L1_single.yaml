# L1 · 单表条件（WHERE / ORDER BY / LIMIT）—— 20 条，断言 id_set
#
# 写用例的两条硬约束（都源自 house 表的真实性质）：
#
#  1. **price 的 50 个值互不相同** → `ORDER BY price` 的 top-N 完全确定，
#     不存在"并列导致取谁都对"的歧义，所以排名类用例可以严格比对。
#  2. **过滤类用例的 room_count 必须 ≥ 黄金结果行数** → prompt 里的 top_k 就是
#     room_count，Agent 会照着写 LIMIT。只要 LIMIT 不真的截断，Agent 的排序自由
#     （prompt 只说"可以按相关列排序"，没规定排哪列）就不会改变结果集，
#     id_set 的比对才是干净的。凡是结果集可能超过 10 行的过滤条件都不放在这一档。
#
# params 的作用是给中断追问生成一个与问题**自洽**的答复（见 agent_runner 的
# _answer_for_interrupt）。注意 budget_max=3000 是本表的真实最大值，等价于"不加价格
# 条件"，用在问题没提预算的用例上不会影响黄金结果集。

- id: L1-001
  tier: L1
  holdout: true
  question: 深圳宝安区3000元以下的一居室，帮我推荐10套
  params: {city: 深圳, district: 宝安区, budget_max: 3000}
  room_count: 10
  assert: {mode: id_set}
  gold_sql: >
    SELECT id, price FROM house
    WHERE city = '深圳' AND district = '宝安区' AND bedroom = 1 AND price <= 3000
    ORDER BY price ASC LIMIT 10
  notes: 基础三条件；宝安区一居室共 3 套（id 1/10/23）

