# ---- 排名类：排序即答案，严格比对（price 无并列，结果确定） ----

- id: L1-017
  tier: L1
  question: 深圳最便宜的3套房子，帮我推荐
  params: {city: 深圳, budget_max: 3000}
  room_count: 3
  assert: {mode: id_set}
  gold_sql: >
    SELECT id, price FROM house
    WHERE city = '深圳'
    ORDER BY price ASC LIMIT 3
  notes: 全局 top-3（id 1/7/2 = 550/600/680）；考 ORDER BY 方向与 LIMIT

- id: L1-018
  tier: L1
  holdout: true
  question: 深圳最贵的3套房子，帮我推荐
  params: {city: 深圳, budget_max: 3000}
  room_count: 3
  assert: {mode: id_set}
  gold_sql: >
    SELECT id, price FROM house
    WHERE city = '深圳'
    ORDER BY price DESC LIMIT 3
  notes: 全局 top-3 降序（id 50/41/46 = 3000/2950/2900）

